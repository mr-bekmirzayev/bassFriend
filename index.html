<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kosmik edit</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;900&display=swap">
  <style>
    :root {
      --btn: rgba(107, 44, 255, .25);
      --btnh: rgba(107, 44, 255, .5);
      --bd: rgba(159, 232, 255, .5);
      --bd2: rgba(159, 232, 255, .35);
      --panel: rgba(5, 1, 13, .75);
      --opt: #12062b;
      --void: #05010d;
      --violet: #6b2cff;
      --magenta: #ff2e88;
      --ice: #9fe8ff;
      --text: #f4eaff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --void: #05010d;
        --text: #f4eaff
      }
    }

    :root[data-theme="dark"] {
      --void: #05010d;
      --text: #f4eaff
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--void);
      color: var(--text);
      font-family: "Unbounded", system-ui, sans-serif;
      overflow: hidden
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    #title {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      text-align: center;
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform
    }

    #title h1 {
      margin: 0;
      padding: 0 3vw;
      white-space: nowrap;
      overflow: visible;
      font-weight: 900;
      font-size: 8vw;
      perspective: 900px;
      line-height: 1.1;
      text-shadow: -3px 0 var(--magenta), 3px 0 var(--ice), 0 0 40px var(--violet)
    }

    #title p {
      margin: .7em 0 0;
      padding: 0 3vw;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 300;
      font-size: 1.3rem;
      letter-spacing: .4em;
      text-indent: .4em
    }

    #ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      transition: opacity .6s
    }

    #ui.hide {
      opacity: 0
    }

    button,
    .btn,
    .rng {
      font: inherit;
      font-weight: 300;
      font-size: .8rem;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--bd);
      border-radius: 999px;
      padding: .75em 1.3em;
      cursor: pointer;
      backdrop-filter: blur(8px)
    }

    button:hover,
    .btn:hover {
      background: var(--btnh)
    }

    button.sw {
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .25)
    }

    button.sw.on {
      border-color: var(--text);
      box-shadow: 0 0 10px var(--violet)
    }

    #sw {
      display: flex;
      gap: 8px
    }

    button:focus-visible,
    .btn:focus-within,
    input[type=range]:focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 3px
    }

    .rng {
      display: flex;
      gap: .8em;
      align-items: center;
      cursor: default
    }

    .rng input {
      width: 120px;
      accent-color: var(--ice)
    }

    .rng output {
      min-width: 3.2em;
      text-align: right
    }

    .rng select {
      font: inherit;
      font-weight: 300;
      color: var(--text);
      background: transparent;
      border: 0;
      cursor: pointer
    }

    .rng select option {
      background: var(--opt);
      color: var(--text)
    }

    #pn {
      display: flex;
      flex-basis: 100%;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap
    }

    #pn[hidden] {
      display: none
    }

    #lib {
      flex-basis: 100%;
      max-width: 560px;
      max-height: 38vh;
      overflow-y: auto;
      border: 1px solid var(--bd2);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      padding: 8px
    }

    #lib[hidden] {
      display: none
    }

    #tp {
      display: flex;
      flex-basis: 100%;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      font-weight: 300;
      font-size: .8rem
    }

    #tp input[type=range] {
      width: min(46vw, 320px);
      accent-color: var(--ice)
    }

    #tp span {
      min-width: 3em;
      text-align: center
    }

    .tr .dl:disabled {
      opacity: .3;
      cursor: default
    }

    .tr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 12px
    }

    .tr:hover {
      background: var(--btn)
    }

    .tr .pl {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: none;
      border: 0;
      padding: .6em .8em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .tr .pl.on {
      font-weight: 900
    }

    .tr .dl {
      padding: .4em .8em
    }

    .empty {
      padding: 14px;
      font-weight: 300;
      font-size: .8rem;
      text-align: center;
      opacity: .8
    }

    .rng input[type=checkbox] {
      width: auto;
      accent-color: var(--ice)
    }

    input[type=file] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px
    }

    #msg {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(14px + env(safe-area-inset-top, 0px));
      text-align: center;
      font-weight: 300;
      font-size: .8rem;
      opacity: .8;
      padding: 0 16px
    }

    #h .ch {
      display: inline-block;
      white-space: pre;
      transform-origin: 50% 100%;
      animation: letIn 1s cubic-bezier(.2, .9, .25, 1.15) both;
      animation-delay: calc(var(--i)*55ms)
    }

    @keyframes letIn {
      0% {
        opacity: 0;
        transform: translateZ(-500px) rotateX(-100deg) rotateY(70deg) translateY(.7em)
      }

      55% {
        opacity: 1
      }

      100% {
        opacity: 1;
        transform: none
      }
    }

    #ar.a3 {
      animation: artIn 1.1s .5s cubic-bezier(.2, .9, .25, 1) both
    }

    @keyframes artIn {
      0% {
        opacity: 0;
        transform: perspective(600px) translateZ(-250px) rotateX(60deg)
      }

      100% {
        opacity: 1;
        transform: none
      }
    }

    @media (prefers-reduced-motion:reduce) {

      #h .ch,
      #ar.a3 {
        animation: none
      }
    }

    #more,
    #mr {
      display: flex;
      flex-basis: 100%;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap
    }

    #mb {
      display: none
    }

    @media (max-width:699px) {
      #ui {
        gap: 6px;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px))
      }

      button,
      .btn,
      .rng {
        font-size: .72rem;
        padding: .6em 1em
      }

      #more {
        display: none;
        gap: 6px;
        max-height: 36vh;
        overflow-y: auto
      }

      #more.open {
        display: flex
      }

      #mb {
        display: inline-block
      }

      #mr {
        gap: 6px
      }

      #tp {
        gap: 6px
      }

      #tp input[type=range] {
        width: min(38vw, 240px)
      }

      .rng input {
        width: 90px
      }
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="title">
    <h1 id="h">𝙈𝙧 𝘽𝙚𝙠𝙢𝙞𝙧𝙯𝙖𝙮𝙚𝙫 ツ</h1>
    <p id="ar">Developer</p>
  </div>
  <div id="msg">Musiqa faylini tanlang – kosmos bitga qarab jonlanadi</div>
  <div id="ui">

    <div id="pn" hidden>

          <option value="mix">Aralash</option>
          <option value="red">Qizil</option>
          <option value="green">Yashil</option>
          <option value="blue">Ko'k</option>
          <option value="yellow">Sariq</option>
          <option value="pink">Pushti</option>
          <option value="white">Oq</option>
        </select></label>
      <label class="rng">Soya<input type="range" id="cm-s" min="0" max="200" step="10"><output
          id="cm-sv"></output></label>
    </div>
    <div id="more">
      <label class="rng">Ta'sir kuchi<input type="range" id="k" min="0" max="200" step="5" value="100"><output
          id="kv">100%</output></label>
      <label class="rng">Bas shakli<select id="vz">
          <option value="0">Chiziqlar</option>
          <option value="1">To'lqin</option>
          <option value="2">Nuqtalar</option>
          <option value="3">Nurlar</option>
          <option value="4">O'chiq</option>
          <option value="5">Poligon</option>
          <option value="6">Spiral</option>
          <option value="7">Sonar</option>
          <option value="8">Ko'zgu</option>
        </select></label>
      <div class="rng"><span>Mavzu</span><span id="sw"></span></div>
      <label class="rng">Takror<select id="rm">
          <option value="0">Bitta takror</option>
          <option value="1">Ro'yxat bo'yicha</option>
          <option value="2">Teskari ro'yxat</option>
          <option value="3">Takrorsiz</option>
        </select></label>
      <button id="cm">Otilib chiquvchilar</button>
      <button id="fs">To'liq ekran</button>
    </div>
    <div id="tp">
      <button id="pv" aria-label="Oldingi musiqa">⏮</button>
      <span id="tm">0:00</span>
      <input type="range" id="sk" min="0" max="1000" value="0" aria-label="Musiqa vaqti">
      <span id="td">0:00</span>
      <button id="nx" aria-label="Keyingi musiqa">⏭</button>
    </div>
    <div id="mr">
      <label class="btn">Musiqani tanlash<input type="file" id="f" accept="audio/*"></label>
      <button id="pp" disabled>Pauza</button>
      <button id="lb">Kutubxona</button>
      <button id="mb" aria-label="Sozlamalar" aria-expanded="false">⚙</button>
    </div>
  </div>
