<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AuraMB</title>
  <link rel="icon" href="./siteLogo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;900&display=swap">
  <style>
    :root {
      --btn: rgba(107, 44, 255, .25);
      --btnh: rgba(107, 44, 255, .5);
      --bd: rgba(159, 232, 255, .5);
      --bd2: rgba(159, 232, 255, .35);
      --panel: rgba(5, 1, 13, .75);
      --opt: #12062b;
      --void: #05010d;
      --violet: #6b2cff;
      --magenta: #ff2e88;
      --ice: #9fe8ff;
      --text: #f4eaff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --void: #05010d;
        --text: #f4eaff
      }
    }

    :root[data-theme="dark"] {
      --void: #05010d;
      --text: #f4eaff
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--void);
      color: var(--text);
      font-family: "Unbounded", system-ui, sans-serif;
      overflow: hidden
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    #title {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      text-align: center;
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform
    }

    #title h1 {
      margin: 0;
      padding: 0 3vw;
      white-space: nowrap;
      overflow: visible;
      font-weight: 900;
      font-size: 8vw;
      perspective: 900px;
      transform-style: preserve-3d;
      line-height: 1.1;
      text-shadow: -3px 0 var(--magenta), 3px 0 var(--ice), 0 0 40px var(--violet)
    }

    #titleEditButton {
      position: fixed;
      z-index: 6;
      top: 50%;
      right: 18px;
      width: 38px;
      height: 38px;
      padding: 0;
      transform: translateY(-50%);
      pointer-events: auto;
      opacity: .9;
      animation: none !important;
    }

    #titleEditButton[hidden],
    #titleEditorPanel[hidden] {
      display: none;
    }

    #titleEditorPanel {
      position: fixed;
      z-index: 7;
      top: 50%;
      left: 50%;
      width: min(620px, 90vw);
      padding: 14px;
      transform: translate(-50%, -50%);
      border: 1px solid var(--bd2);
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .38);
      pointer-events: auto;
      animation: none !important;
    }

    #titleEditorPanel input,
    #titleEditorPanel textarea {
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 10px 12px;
      border: 1px solid var(--bd2);
      border-radius: 8px;
      background: rgba(0, 0, 0, .28);
      color: var(--text);
      font: 300 .85rem/1.5 "Unbounded", system-ui, sans-serif;
    }

    #titleEditorPanel textarea {
      min-height: 84px;
      resize: vertical;
      font-size: 1rem;
      font-weight: 900;
    }

    .title-editor-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .title-editor-actions button {
      padding: .55em .9em;
      font-size: .72rem;
    }

    #title p {
      margin: .7em 0 0;
      padding: 0 3vw;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 300;
      font-size: 1.3rem;
      letter-spacing: .4em;
      text-indent: .4em
    }

    #ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      transition: opacity .6s
    }

    #ui.hide {
      opacity: 0
    }

    button,
    .btn,
    .rng {
      font: inherit;
      font-weight: 300;
      font-size: .8rem;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--bd);
      border-radius: 999px;
      padding: .75em 1.3em;
      cursor: pointer;
      backdrop-filter: blur(8px)
    }

    button:hover,
    .btn:hover {
      background: var(--btnh)
    }

    button.sw {
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .25)
    }

    button.sw.on {
      border-color: var(--text);
      box-shadow: 0 0 10px var(--violet)
    }

    #sw {
      display: flex;
      gap: 8px
    }

    #autoTheme {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.1rem;
      line-height: 1;
    }

    #autoTheme.on {
      background: var(--btnh);
      border-color: var(--ice);
      box-shadow: 0 0 10px var(--ice)
    }

    #autoThemeInterval {
      max-width: 76px;
      font-size: .68rem
    }

    button:focus-visible,
    .btn:focus-within,
    input[type=range]:focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 3px
    }

    .rng {
      display: flex;
      gap: .8em;
      align-items: center;
      cursor: default
    }

    .rng input {
      width: 120px;
      accent-color: var(--ice)
    }

    .rng output {
      min-width: 3.2em;
      text-align: right
    }

    .rng select {
      font: inherit;
      font-weight: 300;
      color: var(--text);
      background: transparent;
      border: 0;
      cursor: pointer
    }

    .rng select option {
      background: var(--opt);
      color: var(--text)
    }

    #pn {
      display: flex;
      flex-basis: 100%;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap
    }

    #pn[hidden] {
      display: none
    }

    #lib {
      flex-basis: 100%;
      max-width: 560px;
      max-height: 38vh;
      overflow-y: auto;
      border: 1px solid var(--bd2);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      padding: 8px
    }

    #lib[hidden] {
      display: none
    }

    #tp {
      display: flex;
      flex-basis: 100%;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      font-weight: 300;
      font-size: .8rem
    }

    #tp input[type=range] {
      width: min(46vw, 320px);
      accent-color: var(--ice)
    }

    #tp span {
      min-width: 3em;
      text-align: center
    }

    .tr .dl:disabled {
      opacity: .3;
      cursor: default
    }

    .tr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 12px
    }

    .tr:hover {
      background: var(--btn)
    }

    .tr .pl {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: none;
      border: 0;
      padding: .6em .8em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .tr .pl.on {
      font-weight: 900
    }

    .tr .dl {
      padding: .4em .8em
    }

    .empty {
      padding: 14px;
      font-weight: 300;
      font-size: .8rem;
      text-align: center;
      opacity: .8
    }

    .rng input[type=checkbox] {
      width: auto;
      accent-color: var(--ice)
    }

    input[type=file] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px
    }

    #msg {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(14px + env(safe-area-inset-top, 0px));
      text-align: center;
      font-weight: 300;
      font-size: .8rem;
      opacity: .8;
      padding: 0 16px
    }

    #h .ch {
      display: inline-block;
      white-space: pre;
      transform-origin: 50% 100%;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      animation: letIn 1s cubic-bezier(.2, .9, .25, 1.15) both;
      animation-delay: calc(var(--i)*55ms)
    }

    #h .ch.minute-x {
      animation: minuteX var(--spin-time, 1.4s) cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--spin-delay, 0ms)
    }

    #h .ch.minute-y {
      animation: minuteY var(--spin-time, 1.4s) cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--spin-delay, 0ms)
    }

    #h .ch.ending {
      animation: letterEnd 1.25s cubic-bezier(.6, 0, .8, .2) both;
      animation-delay: calc(var(--i)*32ms)
    }

    @keyframes letIn {
      0% {
        opacity: 0;
        transform: translateZ(-500px) rotateX(-100deg) rotateY(70deg) translateY(.7em)
      }

      55% {
        opacity: 1
      }

      100% {
        opacity: 1;
        transform: none
      }
    }

    @keyframes minuteX {
      0% {
        transform: rotateX(0)
      }

      48% {
        transform: rotateX(var(--spin-angle, 720deg))
      }

      100% {
        transform: rotateX(0)
      }
    }

    @keyframes minuteY {
      0% {
        transform: rotateY(0)
      }

      48% {
        transform: rotateY(var(--spin-angle, 720deg))
      }

      100% {
        transform: rotateY(0)
      }
    }

    @keyframes letterEnd {
      0% {
        opacity: 1;
        transform: rotateY(0) translateZ(0)
      }

      45% {
        opacity: 1;
        transform: rotateY(210deg) translateZ(80px) scale(1.25)
      }

      100% {
        opacity: 0;
        transform: rotateY(720deg) translateZ(-260px) scale(.05)
      }
    }

    #ar.a3 {
      animation: artIn 1.1s .5s cubic-bezier(.2, .9, .25, 1) both
    }

    @keyframes artIn {
      0% {
        opacity: 0;
        transform: perspective(600px) translateZ(-250px) rotateX(60deg)
      }

      100% {
        opacity: 1;
        transform: none
      }
    }

    @media (prefers-reduced-motion:reduce) {

      #h .ch,
      #h .ch.minute-x,
      #h .ch.minute-y,
      #h .ch.ending,
      #ar.a3 {
        animation: none
      }
    }

    #more,
    #mr {
      display: flex;
      flex-basis: 100%;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap
    }

    #mb {
      display: none
    }

    @media (max-width:699px) {
      #ui {
        gap: 6px;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px))
      }

      button,
      .btn,
      .rng {
        font-size: .72rem;
        padding: .6em 1em
      }

      #more {
        display: none;
        gap: 6px;
        max-height: 36vh;
        overflow-y: auto
      }

      #more.open {
        display: flex
      }

      #mb {
        display: inline-block
      }

      #mr {
        gap: 6px
      }

      #tp {
        gap: 6px
      }

      #tp input[type=range] {
        width: min(38vw, 240px)
      }

      .rng input {
        width: 90px
      }
    }

    button,
    .btn,
    .rng,
    #lib,
    #pn,
    #more {
      transition: background-color .2s ease, border-color .2s ease, transform .22s ease, opacity .22s ease;
    }

    button:active,
    .btn:active {
      transform: scale(.96)
    }

    #ui.hide {
      pointer-events: none
    }

    @media (orientation: landscape) and (max-height: 520px) {
      #ui {
        max-height: 48dvh;
        overflow-y: auto;
        gap: 4px;
        padding: 5px 10px calc(5px + env(safe-area-inset-bottom, 0px));
        align-content: center
      }

      #ui button,
      #ui .btn,
      #ui .rng {
        font-size: clamp(.58rem, 2.3vh, .72rem);
        padding: .48em .8em
      }

      #more,
      #pn {
        gap: 5px
      }

      #more {
        max-height: 22dvh;
        overflow-y: auto
      }

      #lib {
        max-height: 28dvh
      }

      #tp {
        gap: 5px
      }

      #tp input[type=range] {
        width: min(30vw, 220px)
      }

      .rng input {
        width: min(12vw, 76px)
      }
    }

    .MyLogo {
      opacity: 1 !important;
      position: absolute;
      top: -5px;
      font-size: 1.4rem;
      text-shadow: #f4eaff 0 0 10px;

      right: 20px !important;
    }

    .lyrics-toggle {
      position: fixed;
      background-color: white;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      bottom: 20px;
      right: 14px;
    }

    .lyrics-panel {
      position: fixed;
      z-index: 4;
      top: 50%;
      right: 14px;
      display: flex;
      flex-direction: column;
      width: min(340px, 34vw);
      max-height: min(58vh, 620px);
      overflow: hidden;
      transform: translateY(-50%);
      border: 1px solid var(--bd2);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .32);
      animation: lyricsIn .25s ease both;
    }

    .lyrics-panel[hidden] {
      display: none
    }

    @keyframes lyricsIn {
      from {
        opacity: 0;
        transform: translate(10px, -50%)
      }

      to {
        opacity: 1;
        transform: translate(0, -50%)
      }
    }

    .lyrics-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--bd2);
    }

    .lyrics-meta {
      flex: 1;
      min-width: 0
    }

    .lyrics-track,
    .lyrics-status {
      overflow: hidden;
      text-overflow: ellipsis
    }

    .lyrics-track {
      font-size: .82rem;
      font-weight: 900;
      white-space: nowrap
    }

    .lyrics-status {
      margin-top: 5px;
      font-size: .65rem;
      font-weight: 300;
      opacity: .72
    }

    .lyrics-close {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
    }

    .lyrics-content {
      overflow-y: auto;
      padding: 12px 14px 18px;
      overscroll-behavior: contain;
      scrollbar-color: var(--ice) transparent;
    }

    .lyrics-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px 0;
    }

    .lyrics-tools button,
    .lyrics-editor button,
    .lyrics-editor label {
      font-size: .68rem;
      padding: .55em .85em;
    }

    .lyrics-editor {
      display: grid;
      gap: 8px;
      padding: 10px 12px 0;
    }

    .lyrics-editor[hidden] {
      display: none
    }

    .lyrics-editor textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      padding: 10px;
      border: 1px solid var(--bd2);
      border-radius: 8px;
      background: rgba(0, 0, 0, .28);
      color: var(--text);
      font: 300 .72rem/1.6 "Unbounded", system-ui, sans-serif;
    }

    .lyrics-editor textarea:focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 2px;
    }

    .lyrics-editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .lyrics-editor input[type=file] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .lyric-line {
      padding: 6px 8px;
      border-radius: 6px;
      font-size: .77rem;
      line-height: 1.65;
      opacity: .55;
      transition: color .2s ease, opacity .2s ease, background-color .2s ease;
    }

    .lyric-line.active {
      background: var(--btn);
      color: var(--ice);
      opacity: 1
    }

    .lyric-line.user-lyrics {
      color: #fff;
      opacity: 1
    }

    .lyric-line.user-lyrics.active {
      color: #fff
    }

    @media (max-width: 699px) {
      .lyrics-panel {
        top: auto;
        right: 10px;
        bottom: calc(104px + env(safe-area-inset-bottom, 0px));
        width: min(360px, calc(100vw - 20px));
        max-height: 38vh;
        transform: none;
      }

      @keyframes lyricsIn {
        from {
          opacity: 0;
          transform: translateY(8px)
        }

        to {
          opacity: 1;
          transform: translateY(0)
        }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .lyrics-panel {
        animation: none
      }

      .lyric-line {
        transition: none
      }
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <h1 class="MyLogo">𝙈𝙧 𝘽𝙚𝙠𝙢𝙞𝙧𝙯𝙖𝙮𝙚𝙫 ツ</h1>
  <div id="title">
    <h1 id="h">𝙈𝙧 𝘽𝙚𝙠𝙢𝙞𝙧𝙯𝙖𝙮𝙚𝙫 ツ</h1>
    <p id="ar">Developer</p>
  </div>
  <button id="titleEditButton" type="button" aria-label="Sarlavha va artistni tahrirlash" title="Tahrirlash"
    hidden>✎</button>
  <div id="titleEditorPanel" hidden>
    <input id="titleArtistInput" type="text" maxlength="120" aria-label="Artist nomi" placeholder="Artist nomi">
    <textarea id="titleTextInput" maxlength="240" aria-label="Musiqa nomi" placeholder="Musiqa nomi"></textarea>
    <div class="title-editor-actions">
      <button id="titleNewline" type="button" aria-label="Yangi qator" title="Yangi qator">↵</button>
      <button id="titleSave" type="button">Saqlash</button>
      <button id="titleCancel" type="button">Bekor qilish</button>
    </div>
  </div>
  <button id="lyricsToggle" class="lyrics-toggle" aria-label="Qo'shiq so'zlarini ko'rsatish" aria-expanded="false"
    title="Qo'shiq so'zlari"><img width="20px" src="./MusicLiyrcs.png" alt="♫"></button>
  <aside id="lyricsPanel" class="lyrics-panel" aria-label="Qo'shiq so'zlari" hidden>
    <div class="lyrics-head">
      <div class="lyrics-meta">
        <div id="lyricsTrack" class="lyrics-track">Qo'shiq so'zlari</div>
        <div id="lyricsStatus" class="lyrics-status">Musiqa tanlang</div>
      </div>
      <button id="lyricsClose" class="lyrics-close" aria-label="So'zlar panelini yopish">×</button>
    </div>
    <div class="lyrics-tools">
      <button id="lyricsEditToggle" type="button">Matn kiritish / tahrirlash</button>
      <button id="lyricsDeleteSaved" type="button" hidden>Saqlangan matnni o'chirish</button>
    </div>
    <div id="lyricsEditor" class="lyrics-editor" hidden>
      <textarea id="lyricsInput" aria-label="Qo'shiq so'zlari"
        placeholder="Gemini yoki boshqa manbadan ko'chirgan matnni shu yerga qo'ying. Vaqtli [00:12.30] LRC matni ham qabul qilinadi."></textarea>
      <div class="lyrics-editor-actions">
        <label class="btn" for="lyricsFile">.lrc fayl yuklash</label>
        <input id="lyricsFile" type="file" accept=".lrc,.txt,text/plain">
        <button id="lyricsSave" type="button">Saqlash</button>
        <button id="lyricsCancel" type="button">Bekor qilish</button>
      </div>
    </div>
    <div id="lyricsContent" class="lyrics-content"></div>
  </aside>
  <div id="msg">Musiqa faylini tanlang – kosmos bitga qarab jonlanadi</div>
  <div id="ui">
    <div id="lib" hidden></div>
    <div id="pn" hidden>
      <label class="rng">Yoqilgan<input type="checkbox" id="cm-on"></label>
      <label class="rng">Soni<input type="range" id="cm-n" min="0" max="100" step="5"><output
          id="cm-nv"></output></label>
      <label class="rng">Rangi<select id="cm-c">
          <option value="mix">Aralash</option>
          <option value="red">Qizil</option>
          <option value="green">Yashil</option>
          <option value="blue">Ko'k</option>
          <option value="yellow">Sariq</option>
          <option value="pink">Pushti</option>
          <option value="white">Oq</option>
        </select></label>
      <label class="rng">Soya<input type="range" id="cm-s" min="0" max="200" step="10"><output
          id="cm-sv"></output></label>
    </div>
    <div id="more">
      <label class="rng">Ta'sir kuchi<input type="range" id="k" min="0" max="200" step="5" value="100"><output
          id="kv">100%</output></label>
      <label class="rng">Bas shakli<select id="vz">
          <option value="0">Chiziqlar</option>
          <option value="1">To'lqin</option>
          <option value="2">Nuqtalar</option>
          <option value="3">Nurlar</option>
          <option value="4">O'chiq</option>
          <option value="5">Poligon</option>
          <option value="6">Spiral</option>
          <option value="7">Sonar</option>
          <option value="8">Ko'zgu</option>
        </select></label>
      <div class="rng"><span>Mavzu</span><span id="sw"></span><button id="autoTheme" type="button"
          aria-label="Avtomatik mavzu almashishini yoqish" aria-pressed="false"
          title="Avtomatik mavzu">↻</button><select id="autoThemeInterval" aria-label="Mavzu almashish oralig'i"
          title="Almashish oralig'i">
          <option value="30">30 s</option>
          <option value="60" selected>1 min</option>
