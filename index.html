<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kosmik edit</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;900&display=swap">
  <style>
    :root {
      --void: #05010d;
      --violet: #6b2cff;
      --magenta: #ff2e88;
      --ice: #9fe8ff;
      --text: #f4eaff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --void: #05010d;
        --text: #f4eaff
      }
    }

    :root[data-theme="dark"] {
      --void: #05010d;
      --text: #f4eaff
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--void);
      color: var(--text);
      font-family: "Unbounded", system-ui, sans-serif;
      overflow: hidden
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    #title {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      text-align: center;
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform
    }

    #title h1 {
      margin: 0;
      padding: 0 3vw;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 900;
      font-size: 8vw;
      line-height: 1.1;
      text-shadow: -3px 0 var(--magenta), 3px 0 var(--ice), 0 0 40px var(--violet)
    }

    #title p {
      margin: .7em 0 0;
      padding: 0 3vw;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 300;
      font-size: 1.3rem;
      letter-spacing: .4em;
      text-indent: .4em
    }

    #ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      transition: opacity .6s
    }

    #ui.hide {
      opacity: 0
    }

    button,
    .btn,
    .rng {
      font: inherit;
      font-weight: 300;
      font-size: .8rem;
      color: var(--text);
      background: rgba(107, 44, 255, .25);
      border: 1px solid rgba(159, 232, 255, .5);
      border-radius: 999px;
      padding: .75em 1.3em;
      cursor: pointer;
      backdrop-filter: blur(8px)
    }

    button:hover,
    .btn:hover {
      background: rgba(107, 44, 255, .5)
    }

    button:focus-visible,
    .btn:focus-within,
    input[type=range]:focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 3px
    }

    .rng {
      display: flex;
      gap: .8em;
      align-items: center;
      cursor: default
    }

    .rng input {
      width: 120px;
      accent-color: var(--ice)
    }

    .rng output {
      min-width: 3.2em;
      text-align: right
    }

    .rng select {
      font: inherit;
      font-weight: 300;
      color: var(--text);
      background: transparent;
      border: 0;
      cursor: pointer
    }

    .rng select option {
      background: #12062b;
      color: #f4eaff
    }

    #pn {
      display: flex;
      flex-basis: 100%;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap
    }

    #pn[hidden] {
      display: none
    }

    .rng input[type=checkbox] {
      width: auto;
      accent-color: var(--ice)
    }

    input[type=file] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px
    }

    #msg {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(14px + env(safe-area-inset-top, 0px));
      text-align: center;
      font-weight: 300;
      font-size: .8rem;
      opacity: .8;
      padding: 0 16px
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="title">
    <h1 id="h">𝙈𝙧 𝘽𝙚𝙠𝙢𝙞𝙧𝙯𝙖𝙮𝙚𝙫 ツ</h1>
    <p id="ar">Developer</p>
  </div>
  <div id="msg">Musiqa faylini tanlang – kosmos bitga qarab jonlanadi</div>

      <label class="rng">Rangi<select id="cm-c">

          <option value="red">Qizil</option>
          <option value="green">Yashil</option>
          <option value="blue">Ko'k</option>
          <option value="yellow">Sariq</option>
          <option value="pink">Pushti</option>
          <option value="white">Oq</option>
        </select></label>
      <label class="rng">Soya<input type="range" id="cm-s" min="0" max="200" step="10"><output

    </div>
    <label class="btn">Musiqani tanlash<input type="file" id="f" accept="audio/*"></label>
    <button id="pp" disabled>Pauza</button>
    <label class="rng">Ta'sir kuchi<input type="range" id="k" min="0" max="200" step="5" value="100"><output
        id="kv">100%</output></label>
    <label class="rng">Bas shakli<select id="vz">
        <option value="0">Chiziqlar</option>
        <option value="1">To'lqin</option>
        <option value="2">Nuqtalar</option>
        <option value="3">Nurlar</option>
        <option value="4">O'chiq</option>
      </select></label>
    <button id="cm">Otilib chiquvchilar</button>
    <button id="fs">To'liq ekran</button>
  </div>

          var lst = [[cols[(gi + k) % 3], Math.min(.3, gC * .24 * K), R], [RED, Math.min(.55, gR * .42 * K), R * 1.35]]; for (var z = 0; z < 2; z++) { if (lst[z][1] < .01) continue; var g = ctx.createRadialGradient(x, y, 0, x, y, lst[z][2]); g.addColorStop(0, 'rgba(' + lst[z][0] + ',' + lst[z][1] + ')'); g.addColorStop(1, 'rgba(' + lst[z][0] + ',0)'); ctx.fillStyle = g; ctx.fillRect(-W, -H, 3 * W, 3 * H) }

        /* stars */
        var sp = (.003 + K * (bass * .02 + beat * .015)) * dt, lw = Math.max(1, D), maxR = Math.hypot(W, H) / 2;
        for (var i = 0; i < N; i++) {
          var s = S[i], pd = s.d; s.d += sp * (.3 + s.d * 2) * s.z;
          if (s.d * maxR * 1.2 > maxR) { mk(s); pd = s.d }
          var r1 = pd * maxR * 1.2, r2 = s.d * maxR * 1.2, ca = Math.cos(s.a + spin * .3), sa = Math.sin(s.a + spin * .3), al = Math.min(1, s.d * 1.6) * (.4 + K * high * .5);
          ctx.strokeStyle = s.c < .15 ? 'rgba(255,122,46,' + al + ')' : s.c < .5 ? 'rgba(159,232,255,' + al + ')' : 'rgba(244,234,255,' + al + ')';
          ctx.lineWidth = lw * (.5 + s.d * 1.6 * s.z);
          ctx.beginPath(); ctx.moveTo(cx + ca * r1, cy + sa * r1); ctx.lineTo(cx + ca * r2, cy + sa * r2); ctx.stroke();
        }

        /* comets behind the planet (rare, strong bass only) */
        if (pend > 0) { var q = P.on ? Math.min(pend, 8) : 0; pend = 0; for (var i = 0; i < q && C.length < 140; i++) { var cc = Math.random(); C.push({ a: Math.random() * 6.2832, r: m * .13, v: m * (.012 + Math.random() * .02), len: m * (.09 + Math.random() * .2), w: (1.5 + Math.random() * 3) * D, col: ccol(), curve: (Math.random() - .5) * .006 }) } }
        ctx.lineCap = 'round';
        for (var i = C.length - 1; i >= 0; i--) {
          var o = C[i]; o.v *= 1 + .035 * dt + bass * .02; o.r += o.v * dt; o.a += o.curve * dt;
          if (o.r - o.len > maxR) { C.splice(i, 1); continue }
          var ka = Math.cos(o.a), kb = Math.sin(o.a), r0 = Math.max(m * .1, o.r - o.len), g2 = ctx.createLinearGradient(cx + ka * r0, cy + kb * r0, cx + ka * o.r, cy + kb * o.r);
          g2.addColorStop(0, 'rgba(' + o.col + ',0)'); g2.addColorStop(1, 'rgba(' + o.col + ',.5)');
          var sh = Math.min(.9, (beat * .4 + str * .6) * Math.max(K, .3) * P.sh);
          if (sh > .02) { var g3 = ctx.createLinearGradient(cx + ka * r0, cy + kb * r0, cx + ka * o.r, cy + kb * o.r); g3.addColorStop(0, 'rgba(' + o.col + ',0)'); g3.addColorStop(1, 'rgba(' + o.col + ',' + sh * .6 + ')'); ctx.strokeStyle = g3; ctx.lineWidth = o.w * 8; ctx.beginPath(); ctx.moveTo(cx + ka * r0, cy + kb * r0); ctx.lineTo(cx + ka * o.r, cy + kb * o.r); ctx.stroke(); ctx.fillStyle = 'rgba(' + o.col + ',' + sh * .5 + ')'; ctx.beginPath(); ctx.arc(cx + ka * o.r, cy + kb * o.r, o.w * 5, 0, 6.2832); ctx.fill() }
          ctx.strokeStyle = g2; ctx.lineWidth = o.w; ctx.beginPath(); ctx.moveTo(cx + ka * r0, cy + kb * r0); ctx.lineTo(cx + ka * o.r, cy + kb * o.r); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(cx + ka * o.r, cy + kb * o.r, o.w * .9, 0, 6.2832); ctx.fill();
        }

        /* spectrum ring */
        var base = m * (.31 + K * bass * .03), bars = 96, ka2 = Math.min(K, 1.6); if (VZ > 0 && VZ < 4) drawVar(base, m, ka2);
        for (var pass = 0; pass < 3 && VZ === 0; pass++) {
          var off = pass === 0 ? -3 * D : pass === 1 ? 3 * D : 0, col = pass === 0 ? 'rgba(255,46,136,' : pass === 1 ? 'rgba(159,232,255,' : 'rgba(244,234,255,';
          ctx.strokeStyle = col + (pass === 2 ? .9 : .55) + ')'; ctx.lineWidth = Math.max(2, m * .004); ctx.beginPath();
          for (var i = 0; i < bars; i++) {
            var v = data[2 + Math.floor(i * i / bars * 1.6 + i * 1.2)] / 255 || 0, a = i / bars * 6.2832 + spin * 2, r1 = base + off, r2 = base + off + v * m * .15 * ka2 + 4 * D;
            ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
          }
          ctx.stroke();
        }

        /* gyro rings: update 3D rotation + projected points */
        for (var i = 0; i < rings.length; i++) {
          var q2 = rings[i], boost = 1 + K * (bass * 2.5 + mid * 1.5);
          for (var j = 0; j < 3; j++)q2.a[j] += q2.v[j] * boost * dt;
          q2.th += (q2.v[0] > 0 ? 1 : -1) * (.02 + K * mid * .05) * dt;
          q2.t = [Math.cos(q2.a[0]), Math.sin(q2.a[0]), Math.cos(q2.a[1]), Math.sin(q2.a[1]), Math.cos(q2.a[2]), Math.sin(q2.a[2])];
          q2.R = m * q2.r * (1 + K * (bass * .05 + beat * .05));
          for (var j = 0; j <= SEG; j++)q2.pts[j] = proj(q2, j / SEG * 6.2832);
        }
        drawRings(false);

        /* core: shrinks and grows with bass */
        ctx.globalCompositeOperation = 'source-over';
        var cr = m * .13 * (1 + Math.max(-.2, Math.min(.2, (bass - avg) * .8 * K)));
        var gl = ctx.createRadialGradient(cx, cy, cr * .8, cx, cy, cr * 1.5);
        gl.addColorStop(0, 'rgba(107,44,255,' + (.5 + beat * .4 * K) + ')'); gl.addColorStop(1, 'rgba(107,44,255,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, cr * 1.5, 0, 6.2832); ctx.fill();
        var pg = ctx.createRadialGradient(cx - cr * .3, cy - cr * .3, cr * .1, cx, cy, cr);
        pg.addColorStop(0, '#1c0a3d'); pg.addColorStop(1, '#030008');
        ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(cx, cy, cr, 0, 6.2832); ctx.fill();
        drawRings(true);

        if (gR > .2 && !reduce) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,10,25,' + Math.min(.16, gR * gR * .12 * K) + ')'; ctx.fillRect(-W, -H, 3 * W, 3 * H) }
        tt.style.transform = 'translate3d(' + (sx / D) + 'px,' + (sy / D) + 'px,0) translateY(-50%) rotate(' + rot + 'rad) scale(' + zoom + ')';
      }
      requestAnimationFrame(frame);
    })();
